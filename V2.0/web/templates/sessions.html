{% extends "base.html" %}

{% block title %}Scan Sessions{% endblock %}

{% block content %}
<style>
    /* Page layout */
    .sessions-page {
        max-width: 100%;
        margin: 0;
        padding: 1rem;
    }

    /* Session Browser Styles */
    .session-browser {
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        overflow: hidden;
        border: 1px solid #f0f4f8;
    }

    .session-browser-header {
        padding: 2rem 2.5rem;
        background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .session-browser-title {
        display: flex;
        align-items: center;
        gap: 1rem;
        font-size: 2rem;
        font-weight: 700;
    }

    .session-browser-stats {
        display: flex;
        gap: 2.5rem;
        font-size: 0.95rem;
    }

    .stat-item {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
    }

    .stat-value {
        font-size: 1.6rem;
        font-weight: 700;
        margin-bottom: 0.25rem;
    }

    .stat-label {
        opacity: 0.9;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .session-browser-content {
        padding: 2.5rem;
    }

    .session-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        gap: 1rem;
        padding-bottom: 1.5rem;
        border-bottom: 2px solid #f0f4f8;
    }

    .session-search {
        flex: 1;
        max-width: 500px;
        position: relative;
    }

    .session-search input {
        width: 100%;
        padding: 0.75rem 1.25rem 0.75rem 3rem;
        border: 2px solid #e1e8ed;
        border-radius: 10px;
        font-size: 1rem;
        transition: all 0.3s ease;
        background: #f8f9fa;
    }

    .session-search input:focus {
        outline: none;
        border-color: #4a90e2;
        box-shadow: 0 0 0 4px rgba(74, 144, 226, 0.1);
        background: white;
    }

    .session-search::before {
        content: '🔍';
        position: absolute;
        left: 1.25rem;
        top: 50%;
        transform: translateY(-50%);
        font-size: 1.2rem;
    }

    .session-actions {
        display: flex;
        gap: 0.75rem;
    }

    .action-btn {
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 0.6rem;
    }

    .btn-refresh {
        background: #f0f4f8;
        color: #2c3e50;
    }

    .btn-refresh:hover {
        background: #4a90e2;
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
    }

    .sessions-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
        gap: 2rem;
        margin-top: 1.5rem;
    }

    .session-card {
        background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
        border: 2px solid #e1e8ed;
        border-radius: 12px;
        padding: 1.75rem;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        position: relative;
        overflow: hidden;
    }

    .session-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 5px;
        background: linear-gradient(90deg, #4a90e2, #357abd);
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .session-card:hover {
        border-color: #4a90e2;
        transform: translateY(-6px);
        box-shadow: 0 12px 40px rgba(74, 144, 226, 0.2);
    }

    .session-card:hover::before {
        opacity: 1;
    }

    .session-card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 1.25rem;
        gap: 1rem;
    }

    .session-name {
        font-weight: 700;
        font-size: 1.2rem;
        color: #2c3e50;
        margin: 0;
        line-height: 1.3;
    }

    .session-status {
        padding: 0.35rem 0.85rem;
        border-radius: 14px;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        white-space: nowrap;
    }

    .status-completed {
        background: #d4edda;
        color: #155724;
    }

    .status-in_progress {
        background: #fff3cd;
        color: #856404;
    }

    .status-failed {
        background: #f8d7da;
        color: #721c24;
    }

    .session-meta {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
        margin-bottom: 1.25rem;
        padding: 1.25rem;
        background: rgba(74, 144, 226, 0.04);
        border-radius: 8px;
        border: 1px solid rgba(74, 144, 226, 0.1);
    }

    .meta-item {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
    }

    .meta-label {
        font-size: 0.75rem;
        color: #6c757d;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .meta-value {
        font-size: 1rem;
        color: #2c3e50;
        font-weight: 600;
    }

    .session-card-actions {
        display: flex;
        gap: 0.6rem;
        margin-top: 1.25rem;
        padding-top: 1.25rem;
        border-top: 1px solid #e1e8ed;
    }

    .card-action-btn {
        flex: 1;
        padding: 0.65rem;
        border: none;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
    }

    .btn-view {
        background: #4a90e2;
        color: white;
    }

    .btn-view:hover {
        background: #357abd;
        transform: scale(1.05);
        box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
    }

    .btn-download {
        background: #10b981;
        color: white;
    }

    .btn-download:hover {
        background: #059669;
        transform: scale(1.05);
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-delete {
        background: #ef4444;
        color: white;
    }

    .btn-delete:hover {
        background: #dc2626;
        transform: scale(1.05);
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    .empty-sessions {
        text-align: center;
        padding: 5rem 2rem;
        color: #6c757d;
    }

    .empty-sessions-icon {
        font-size: 5rem;
        margin-bottom: 1.5rem;
        opacity: 0.4;
    }

    .empty-sessions h3 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
        color: #2c3e50;
    }

    .loading-spinner {
        text-align: center;
        padding: 4rem;
        font-size: 2rem;
    }

    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    .spinner {
        display: inline-block;
        animation: spin 1s linear infinite;
    }

    /* Session Details Modal */
    .session-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(8px);
    }

    .session-modal.active {
        display: flex;
    }

    .modal-content-large {
        background: white;
        border-radius: 16px;
        max-width: 1000px;
        width: 92%;
        max-height: 92vh;
        overflow: auto;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
    }

    .modal-header-large {
        padding: 2rem 2.5rem;
        background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 10;
    }

    .modal-title-large {
        font-size: 1.75rem;
        font-weight: 700;
        margin: 0;
    }

    .modal-close {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        font-size: 2rem;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .modal-close:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: rotate(90deg);
    }

    .modal-body-large {
        padding: 2.5rem;
    }

    .session-detail-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1.5rem;
        margin-bottom: 2.5rem;
        padding: 1.5rem;
        background: #f8f9fa;
        border-radius: 10px;
    }

    .detail-item {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .detail-label {
        font-weight: 700;
        color: #6c757d;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .detail-value {
        color: #2c3e50;
        font-size: 1rem;
    }

    .detail-value code {
        background: white;
        padding: 0.4rem 0.8rem;
        border-radius: 6px;
        font-family: 'Courier New', monospace;
        border: 1px solid #e1e8ed;
        display: inline-block;
    }

    .file-list-header {
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 2px solid #e1e8ed;
    }

    .file-list-header h4 {
        margin: 0;
        color: #2c3e50;
        font-size: 1.3rem;
    }

    .file-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .file-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid #f0f4f8;
        transition: background 0.2s ease;
    }

    .file-item:hover {
        background: #f8f9fa;
    }

    .file-item:last-child {
        border-bottom: none;
    }

    .file-name {
        flex: 1;
        font-family: 'Courier New', monospace;
        font-size: 0.9rem;
        color: #2c3e50;
        word-break: break-all;
    }

    .file-size {
        color: #6c757d;
        font-size: 0.85rem;
        margin-right: 1.25rem;
        min-width: 80px;
        text-align: right;
    }

    .file-download-btn {
        padding: 0.5rem 1.25rem;
        background: #4a90e2;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
    }

    .file-download-btn:hover {
        background: #357abd;
        transform: scale(1.08);
        box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
    }

    /* Responsive design */
    @media (max-width: 768px) {
        .sessions-grid {
            grid-template-columns: 1fr;
        }

        .session-browser-header {
            flex-direction: column;
            gap: 1.5rem;
            align-items: flex-start;
        }

        .session-browser-stats {
            width: 100%;
            justify-content: space-between;
        }

        .session-controls {
            flex-direction: column;
            align-items: stretch;
        }

        .session-search {
            max-width: none;
        }
    }
</style>

<div class="sessions-page">
    <div class="session-browser">
        <div class="session-browser-header">
            <div class="session-browser-title">
                <span>📁</span>
                <span>Scan Sessions</span>
            </div>
            <div class="session-browser-stats" id="storageStats">
                <div class="stat-item">
                    <span class="stat-value" id="statSessionCount">--</span>
                    <span class="stat-label">Sessions</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="statTotalFiles">--</span>
                    <span class="stat-label">Files</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="statTotalSize">--</span>
                    <span class="stat-label">Total Size</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="statDiskUsage">--</span>
                    <span class="stat-label">Disk Used</span>
                </div>
            </div>
        </div>
        
        <div class="session-browser-content">
            <div class="session-controls">
                <div class="session-search">
                    <input type="text" id="sessionSearchInput" placeholder="Search sessions by name..." onkeyup="filterSessions()">
                </div>
                <div class="session-actions">
                    <button class="action-btn btn-refresh" onclick="reloadAndRefresh()">
                        🔄 Reload & Refresh
                    </button>
                </div>
            </div>
            
            <div id="sessionsGrid" class="sessions-grid">
                <div class="loading-spinner">
                    <span class="spinner">⏳</span>
                    <p>Loading sessions...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Session Details Modal -->
<div id="sessionModal" class="session-modal">
    <div class="modal-content-large">
        <div class="modal-header-large">
            <h3 class="modal-title-large" id="modalSessionName">Session Details</h3>
            <button class="modal-close" onclick="closeSessionModal()">×</button>
        </div>
        <div class="modal-body-large">
            <div id="modalSessionDetails">
                <!-- Details loaded dynamically -->
            </div>
            <div id="modalFileList">
                <!-- File list loaded dynamically -->
            </div>
        </div>
    </div>
</div>

<script>
// ========== SESSION BROWSER FUNCTIONS ==========

// Load storage statistics
async function loadStorageStats() {
    try {
        const response = await fetch('/api/storage/stats');
        const data = await response.json();
        
        if (data.success) {
            const stats = data.stats;
            document.getElementById('statSessionCount').textContent = stats.session_count;
            document.getElementById('statTotalFiles').textContent = stats.total_files;
            document.getElementById('statTotalSize').textContent = `${stats.total_size_mb.toFixed(1)} MB`;
            document.getElementById('statDiskUsage').textContent = `${stats.usage_percentage.toFixed(1)}%`;
        }
    } catch (error) {
        console.error('Error loading storage stats:', error);
    }
}

// Reload sessions index from disk (for after running rebuild script)
async function reloadSessionsIndex() {
    try {
        const response = await fetch('/api/storage/reload', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        });
        const data = await response.json();
        
        if (data.success) {
            console.log(`✅ Reloaded sessions index: ${data.sessions_before} → ${data.sessions_after} sessions`);
            if (data.sessions_added > 0) {
                showNotification(`Found ${data.sessions_added} new session(s)!`, 'success');
            }
            return true;
        } else {
            console.error('Failed to reload sessions index:', data.error);
            showNotification('Failed to reload sessions index', 'error');
            return false;
        }
    } catch (error) {
        console.error('Error reloading sessions index:', error);
        showNotification('Error reloading sessions index', 'error');
        return false;
    }
}

// Reload index from disk and refresh display
async function reloadAndRefresh() {
    await reloadSessionsIndex();
    await loadSessions();
}

// Load all sessions
async function loadSessions() {
    const grid = document.getElementById('sessionsGrid');
    
    // Show loading spinner
    grid.innerHTML = `
        <div class="loading-spinner">
            <span class="spinner">⏳</span>
            <p>Loading sessions...</p>
        </div>
    `;
    
    try {
        const response = await fetch('/api/storage/sessions');
        const data = await response.json();
        
        if (data.success) {
            displaySessions(data.sessions);
            loadStorageStats(); // Update stats after loading sessions
        } else {
            grid.innerHTML = `
                <div class="empty-sessions">
                    <div class="empty-sessions-icon">❌</div>
                    <h3>Failed to Load Sessions</h3>
                    <p>${data.error || 'Unknown error'}</p>
                </div>
            `;
        }
    } catch (error) {
        console.error('Error loading sessions:', error);
        grid.innerHTML = `
            <div class="empty-sessions">
                <div class="empty-sessions-icon">❌</div>
                <h3>Connection Error</h3>
                <p>Could not connect to scanner</p>
            </div>
        `;
    }
}

// Display sessions in grid
function displaySessions(sessions) {
    const grid = document.getElementById('sessionsGrid');
    
    if (!sessions || sessions.length === 0) {
        grid.innerHTML = `
            <div class="empty-sessions">
                <div class="empty-sessions-icon">📂</div>
                <h3>No Scan Sessions Yet</h3>
                <p>Complete your first scan to see it here</p>
            </div>
        `;
        return;
    }
    
    grid.innerHTML = sessions.map(session => `
        <div class="session-card" onclick="viewSessionDetails('${session.session_id}')">
            <div class="session-card-header">
                <h3 class="session-name">${session.scan_name || 'Unnamed Scan'}</h3>
                <span class="session-status status-${session.status}">${session.status.replace('_', ' ')}</span>
            </div>
            
            <div class="session-meta">
                <div class="meta-item">
                    <span class="meta-label">Files</span>
                    <span class="meta-value">${session.total_files}</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">Size</span>
                    <span class="meta-value">${formatBytes(session.total_size_bytes)}</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">Started</span>
                    <span class="meta-value">${formatTimestamp(session.start_time)}</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">Duration</span>
                    <span class="meta-value">${formatDuration(session.start_time, session.end_time)}</span>
                </div>
            </div>
            
            <div class="session-card-actions" onclick="event.stopPropagation()">
                <button class="card-action-btn btn-view" onclick="viewSessionDetails('${session.session_id}')">
                    👁️ View
                </button>
                <button class="card-action-btn btn-download" onclick="downloadSession('${session.session_id}', '${session.scan_name}')">
                    ⬇️ Download
                </button>
                <button class="card-action-btn btn-delete" onclick="deleteSession('${session.session_id}', '${session.scan_name}')">
                    🗑️ Delete
                </button>
            </div>
        </div>
    `).join('');
}

// Filter sessions by search input
function filterSessions() {
    const searchTerm = document.getElementById('sessionSearchInput').value.toLowerCase();
    const cards = document.querySelectorAll('.session-card');
    
    cards.forEach(card => {
        const sessionName = card.querySelector('.session-name').textContent.toLowerCase();
        if (sessionName.includes(searchTerm)) {
            card.style.display = 'block';
        } else {
            card.style.display = 'none';
        }
    });
}

// View session details in modal
async function viewSessionDetails(sessionId) {
    const modal = document.getElementById('sessionModal');
    const detailsDiv = document.getElementById('modalSessionDetails');
    const fileListDiv = document.getElementById('modalFileList');
    
    // Show modal with loading state
    modal.classList.add('active');
    detailsDiv.innerHTML = '<p>Loading session details...</p>';
    fileListDiv.innerHTML = '';
    
    try {
        const response = await fetch(`/api/storage/sessions/${sessionId}`);
        const data = await response.json();
        
        if (data.success) {
            const session = data.session;
            
            // Update modal title
            document.getElementById('modalSessionName').textContent = session.scan_name || 'Unnamed Scan';
            
            // Display session details
            detailsDiv.innerHTML = `
                <div class="session-detail-grid">
                    <div class="detail-item">
                        <span class="detail-label">Session ID</span>
                        <span class="detail-value"><code>${session.session_id}</code></span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Status</span>
                        <span class="session-status status-${session.status}">${session.status.replace('_', ' ')}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Total Files</span>
                        <span class="detail-value">${data.file_count} files</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Total Size</span>
                        <span class="detail-value">${formatBytes(session.total_size_bytes)}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Start Time</span>
                        <span class="detail-value">${formatTimestamp(session.start_time)}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">End Time</span>
                        <span class="detail-value">${session.end_time ? formatTimestamp(session.end_time) : 'In Progress'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">XMP Metadata</span>
                        <span class="detail-value">${data.has_xmp ? '✅ Available' : '❌ Not Available'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Camera Positions</span>
                        <span class="detail-value">${data.has_camera_positions ? '✅ Available' : '❌ Not Available'}</span>
                    </div>
                </div>
                
                <div class="file-list-header">
                    <h4>Session Files (${data.files.length})</h4>
                </div>
            `;
            
            // Display file list
            if (data.files.length > 0) {
                fileListDiv.innerHTML = `
                    <ul class="file-list">
                        ${data.files.map(file => `
                            <li class="file-item">
                                <span class="file-name">${file.filename}</span>
                                <span class="file-size">${formatBytes(file.size_bytes)}</span>
                                <button class="file-download-btn" onclick="downloadFile('${sessionId}', '${file.filename}')">
                                    ⬇️ Download
                                </button>
                            </li>
                        `).join('')}
                    </ul>
                `;
            } else {
                fileListDiv.innerHTML = '<p style="text-align: center; color: #6c757d; padding: 2rem;">No files in this session</p>';
            }
        } else {
            detailsDiv.innerHTML = `<p style="color: #ef4444;">Error: ${data.error}</p>`;
        }
    } catch (error) {
        console.error('Error loading session details:', error);
        detailsDiv.innerHTML = `<p style="color: #ef4444;">Failed to load session details</p>`;
    }
}

// Close session modal
function closeSessionModal() {
    document.getElementById('sessionModal').classList.remove('active');
}

// Download individual file
function downloadFile(sessionId, filename) {
    const url = `/api/storage/sessions/${sessionId}/files/${filename}`;
    window.open(url, '_blank');
}

// Download entire session (triggers browser downloads for all files)
async function downloadSession(sessionId, scanName) {
    if (!confirm(`Download all files from "${scanName}"?`)) {
        return;
    }
    
    try {
        // Get session details to know what files to download
        const response = await fetch(`/api/storage/sessions/${sessionId}`);
        const data = await response.json();
        
        if (data.success && data.files.length > 0) {
            // Download each file with a small delay to avoid overwhelming the browser
            for (let i = 0; i < data.files.length; i++) {
                const file = data.files[i];
                setTimeout(() => {
                    downloadFile(sessionId, file.filename);
                }, i * 100); // 100ms delay between downloads
            }
            
            showAlert(`Downloading ${data.files.length} files...`, 'info', 3000);
        } else {
            showAlert('No files to download', 'warning', 2000);
        }
    } catch (error) {
        console.error('Error downloading session:', error);
        showAlert('Failed to download session', 'error', 3000);
    }
}

// Delete session
async function deleteSession(sessionId, scanName) {
    if (!confirm(`Are you sure you want to delete "${scanName}"?\n\nThis action cannot be undone.`)) {
        return;
    }
    
    try {
        const response = await fetch(`/api/storage/sessions/${sessionId}`, {
            method: 'DELETE'
        });
        
        const data = await response.json();
        
        if (data.success) {
            showAlert(`Deleted "${scanName}" (freed ${formatBytes(data.space_freed)})`, 'success', 3000);
            loadSessions(); // Reload session list
        } else {
            showAlert(`Failed to delete session: ${data.error}`, 'error', 3000);
        }
    } catch (error) {
        console.error('Error deleting session:', error);
        showAlert('Failed to delete session', 'error', 3000);
    }
}

// Helper: Format bytes to human-readable format
function formatBytes(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

// Helper: Format timestamp to readable date
function formatTimestamp(timestamp) {
    if (!timestamp) return 'N/A';
    const date = new Date(timestamp * 1000);
    return date.toLocaleString();
}

// Helper: Format duration between two timestamps
function formatDuration(startTime, endTime) {
    if (!startTime) return 'N/A';
    if (!endTime) return 'In progress';
    
    const durationSeconds = endTime - startTime;
    const hours = Math.floor(durationSeconds / 3600);
    const minutes = Math.floor((durationSeconds % 3600) / 60);
    const seconds = Math.floor(durationSeconds % 60);
    
    if (hours > 0) {
        return `${hours}h ${minutes}m`;
    } else if (minutes > 0) {
        return `${minutes}m ${seconds}s`;
    } else {
        return `${seconds}s`;
    }
}

// Close modal when clicking outside
window.onclick = function(event) {
    const modal = document.getElementById('sessionModal');
    if (event.target === modal) {
        closeSessionModal();
    }
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
    loadSessions();
    loadStorageStats();
});

// ========== END SESSION BROWSER FUNCTIONS ==========
</script>
