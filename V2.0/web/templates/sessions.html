{% extends "base.html" %}

{% block title %}Scan Sessions - 3D Scanner{% endblock %}

{% block head %}
<style>
/* Session browser styles */
.sessions-page {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 20px;
}

.session-browser {
    max-width: 1200px;
    margin: 0 auto;
    background: white;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    overflow: hidden;
}

.session-browser-header {
    background: #f8fafc;
    padding: 20px;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
}

.session-browser-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 24px;
    font-weight: 700;
    color: #1a202c;
}

.session-browser-stats {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.stat-item {
    text-align: center;
    padding: 8px 16px;
    background: white;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
    min-width: 80px;
}

.stat-value {
    display: block;
    font-size: 18px;
    font-weight: 600;
    color: #2d3748;
}

.stat-label {
    display: block;
    font-size: 12px;
    color: #718096;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.session-browser-content {
    padding: 20px;
}

.session-controls {
    margin-bottom: 20px;
    display: flex;
    gap: 15px;
    align-items: center;
    flex-wrap: wrap;
}

.session-search input {
    padding: 10px 15px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 14px;
    min-width: 250px;
}

.btn {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.btn-primary {
    background: #3182ce;
    color: white;
}

.btn-primary:hover {
    background: #2c5aa0;
}

.btn-danger {
    background: #e53e3e;
    color: white;
}

.btn-danger:hover {
    background: #c53030;
}

.btn-download {
    background: #38a169;
    color: white;
}

.btn-download:hover {
    background: #2f855a;
}

.sessions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.session-card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 20px;
    transition: all 0.2s;
}

.session-card:hover {
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    border-color: #cbd5e0;
}

.session-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 15px;
}

.session-name {
    font-size: 18px;
    font-weight: 600;
    color: #2d3748;
    margin: 0;
}

.session-date {
    font-size: 12px;
    color: #718096;
}

.session-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 15px;
    font-size: 14px;
}

.session-stat {
    display: flex;
    justify-content: space-between;
}

.session-stat-label {
    color: #718096;
}

.session-stat-value {
    color: #2d3748;
    font-weight: 500;
}

.session-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.loading {
    text-align: center;
    padding: 40px;
    color: #718096;
}

.error-message {
    background: #fed7d7;
    color: #c53030;
    padding: 15px;
    border-radius: 8px;
    margin: 20px 0;
}

/* Spinner styles */
.spinner {
    border: 3px solid #f3f4f6;
    border-top: 3px solid #3182ce;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    animation: spin 1s linear infinite;
    margin: 0 auto;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>
{% endblock %}

{% block content %}
<div class="sessions-page">
    <div class="session-browser">
        <div class="session-browser-header">
            <div class="session-browser-title">
                <span>📁</span>
                <span>Scan Sessions</span>
            </div>
            <div class="session-browser-stats" id="storageStats">
                <div class="stat-item">
                    <span class="stat-value" id="statSessionCount">--</span>
                    <span class="stat-label">Sessions</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="statTotalFiles">--</span>
                    <span class="stat-label">Files</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="statTotalSize">--</span>
                    <span class="stat-label">Total Size</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="statDiskUsage">--</span>
                    <span class="stat-label">Disk Used</span>
                </div>
            </div>
        </div>
        
        <div class="session-browser-content">
            <div class="session-controls">
                <div class="session-search">
                    <input type="text" id="sessionSearchInput" placeholder="Search sessions by name..." onkeyup="filterSessions()">
                </div>
                <button class="btn btn-primary" onclick="reloadSessions()">🔄 Refresh</button>
            </div>
            
            <div id="sessionsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading sessions...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
console.log('✅ Sessions page JavaScript loading...');

// Track ongoing downloads to prevent duplicates
const activeDownloads = new Set();

// Simple download function without complex status checking
async function downloadSession(sessionId, scanName) {
    if (activeDownloads.has(sessionId)) {
        console.log('Download already in progress for session:', sessionId);
        return;
    }
    
    if (!confirm('Download "' + scanName + '" as ZIP file?\\n\\nThis will create a ZIP archive and may take 10-30 seconds depending on scan size.')) {
        return;
    }
    
    activeDownloads.add(sessionId);
    
    const downloadButtons = document.querySelectorAll('button[data-session-id="' + sessionId + '"].btn-download');
    downloadButtons.forEach(btn => {
        btn.disabled = true;
        btn.style.opacity = '0.6';
        btn.innerHTML = '⏳ Creating ZIP...';
    });
    
    try {
        const downloadUrl = '/api/storage/sessions/' + sessionId + '/download';
        window.location.href = downloadUrl;
        
        setTimeout(() => {
            downloadButtons.forEach(btn => {
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.innerHTML = '⬇️ Download';
            });
            activeDownloads.delete(sessionId);
        }, 5000);
        
    } catch (error) {
        console.error('Error downloading session:', error);
        downloadButtons.forEach(btn => {
            btn.disabled = false;
            btn.style.opacity = '1';
            btn.innerHTML = '⬇️ Download';
        });
        activeDownloads.delete(sessionId);
        alert('Failed to download session');
    }
}

// Simple delete function
async function deleteSession(sessionId, scanName) {
    if (!confirm('Delete "' + scanName + '"?\\n\\nThis will permanently delete all files in this session. This action cannot be undone.')) {
        return;
    }
    
    try {
        const response = await fetch('/api/storage/sessions/' + sessionId, {
            method: 'DELETE'
        });
        
        if (response.ok) {
            alert('Session deleted successfully');
            loadSessions();
        } else {
            alert('Failed to delete session');
        }
    } catch (error) {
        console.error('Error deleting session:', error);
        alert('Failed to delete session');
    }
}

// Load sessions from server
async function loadSessions() {
    console.log('Loading sessions...');
    const container = document.getElementById('sessionsContainer');
    
    try {
        const response = await fetch('/api/storage/sessions');
        const data = await response.json();
        
        if (data.sessions && data.sessions.length > 0) {
            displaySessions(data.sessions);
        } else {
            container.innerHTML = '<div class="loading"><p>No sessions found</p></div>';
        }
        
        // Update stats
        updateStats(data);
        
    } catch (error) {
        console.error('Error loading sessions:', error);
        container.innerHTML = '<div class="error-message">Failed to load sessions</div>';
    }
}

// Display sessions in grid
function displaySessions(sessions) {
    const container = document.getElementById('sessionsContainer');
    
    const grid = document.createElement('div');
    grid.className = 'sessions-grid';
    
    sessions.forEach(session => {
        const card = createSessionCard(session);
        grid.appendChild(card);
    });
    
    container.innerHTML = '';
    container.appendChild(grid);
}

// Create individual session card
function createSessionCard(session) {
    const card = document.createElement('div');
    card.className = 'session-card';
    
    const date = new Date(session.start_time).toLocaleDateString();
    const fileCount = session.file_count || 0;
    const size = formatBytes(session.total_size || 0);
    
    card.innerHTML = 
        '<div class="session-header">' +
            '<h3 class="session-name">' + (session.scan_name || session.session_id) + '</h3>' +
            '<div class="session-date">' + date + '</div>' +
        '</div>' +
        '<div class="session-stats">' +
            '<div class="session-stat">' +
                '<span class="session-stat-label">Files:</span>' +
                '<span class="session-stat-value">' + fileCount + '</span>' +
            '</div>' +
            '<div class="session-stat">' +
                '<span class="session-stat-label">Size:</span>' +
                '<span class="session-stat-value">' + size + '</span>' +
            '</div>' +
        '</div>' +
        '<div class="session-actions">' +
            '<button class="btn btn-download" data-session-id="' + session.session_id + '" onclick="downloadSession(\'' + session.session_id + '\', \'' + (session.scan_name || session.session_id) + '\')">⬇️ Download</button>' +
            '<button class="btn btn-danger" onclick="deleteSession(\'' + session.session_id + '\', \'' + (session.scan_name || session.session_id) + '\')">🗑️ Delete</button>' +
        '</div>';
    
    return card;
}

// Update storage stats
function updateStats(data) {
    document.getElementById('statSessionCount').textContent = data.sessions ? data.sessions.length : '0';
    document.getElementById('statTotalFiles').textContent = data.total_files || '0';
    document.getElementById('statTotalSize').textContent = formatBytes(data.total_size || 0);
    document.getElementById('statDiskUsage').textContent = data.disk_usage || 'Unknown';
}

// Filter sessions by search
function filterSessions() {
    const searchTerm = document.getElementById('sessionSearchInput').value.toLowerCase();
    const cards = document.querySelectorAll('.session-card');
    
    cards.forEach(card => {
        const name = card.querySelector('.session-name').textContent.toLowerCase();
        if (name.includes(searchTerm)) {
            card.style.display = 'block';
        } else {
            card.style.display = 'none';
        }
    });
}

// Reload sessions
function reloadSessions() {
    loadSessions();
}

// Format bytes to human readable
function formatBytes(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

// Load sessions when page loads
document.addEventListener('DOMContentLoaded', function() {
    console.log('✅ Sessions page loaded');
    loadSessions();
});
</script>
{% endblock %}
